# Valida el propio repositorio de AES: documento consolidado al día y scripts sin errores.
# Versión 1.2.0.
name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: AES-CORE.md al día
        run: ./scripts/build-core.sh --check
      - name: Sintaxis de scripts
        run: |
          shopt -s nullglob
          for f in scripts/*.sh profiles/reference/*/ci/*.sh profiles/reference/*/.claude/hooks/*.sh profiles/reference/*/.claude/scripts/*.sh; do
            bash -n "$f" || exit 1
            echo "ok $f"
          done
          for f in profiles/reference/*/ci/*.mjs; do
            node --check "$f" || exit 1
            echo "ok $f"
          done
      - name: ShellCheck
        run: |
          shopt -s nullglob
          shellcheck scripts/*.sh profiles/reference/*/ci/*.sh profiles/reference/*/.claude/hooks/*.sh profiles/reference/*/.claude/scripts/*.sh
      - name: JSON y YAML válidos
        run: |
          shopt -s nullglob
          for f in profiles/reference/*/opencode.json profiles/reference/*/.claude/*.json; do
            python3 -m json.tool "$f" > /dev/null || exit 1
            echo "ok $f"
          done
          for f in profiles/reference/*/.github/workflows/*.yml .github/workflows/*.yml docs/ci/*.yml; do
            python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f" || exit 1
            echo "ok $f"
          done
